grumphp:
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: 'docker compose exec -T php'
    tasks:
        phpunit:
            config_file: phpunit.xml
            coverage-clover: 'build/logs/clover.xml'
        shell:
            scripts:
                - ["-c", "/var/www/html/vendor/bin/coverage-check /var/www/html/build/logs/clover.xml 8"]
        # phpcs:
        #     standard:
        #         - 'PSR12'

